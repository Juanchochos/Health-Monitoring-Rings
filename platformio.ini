; Ring cardiovascular monitor firmware (MAX30003 ECG + MAX30102 PPG on nRF52840).
;
;   pio run -e feather_phase1 -t upload     Phase 1: bus and silicon sanity check
;   pio run -e feather_phase2 -t upload     Phase 2: register config + polling CSV
;   pio run -e feather_phase3 -t upload     Phase 3: GPIOTE/PPI interrupts + ring buffers
;   pio run -e feather_nrf52840 -t upload   Phase 4: full DSP + serial/BLE telemetry
;   pio run -e bt840                        Phase 4 on the custom Fanstel BT840 PCB
;   pio test -e native                      Host unit tests (buffering + DSP)

[platformio]
default_envs = feather_nrf52840

[nrf52_common]
platform = nordicnrf52
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
    Adafruit TinyUSB Library
build_flags =
    -I include
    -Wall
    -Wno-unused-parameter

[feather_common]
extends = nrf52_common
board = adafruit_feather_nrf52840
build_flags =
    ${nrf52_common.build_flags}
    -DBOARD_FEATHER_NRF52840

[env:feather_phase1]
extends = feather_common
build_flags = ${feather_common.build_flags} -DFW_PHASE=1

[env:feather_phase2]
extends = feather_common
build_flags = ${feather_common.build_flags} -DFW_PHASE=2

[env:feather_phase3]
extends = feather_common
build_flags = ${feather_common.build_flags} -DFW_PHASE=3

[env:feather_nrf52840]
extends = feather_common
build_flags = ${feather_common.build_flags} -DFW_PHASE=4

[env:bt840]
extends = nrf52_common
board = bt840
board_build.variants_dir = variants
build_flags =
    ${nrf52_common.build_flags}
    -DBOARD_BT840
    -DFW_PHASE=4

[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_ignore = hal, drivers, telemetry, app
build_flags =
    -I include
    -Wall
    -pthread
    -lm
    -DUNITY_INCLUDE_DOUBLE
